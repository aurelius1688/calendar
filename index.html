<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>液态玻璃日历</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background: linear-gradient(135deg, #080c14, #0e1b2d, #132e4b, #0a1420);
            min-height: 100vh;
            font-family: "Segoe UI", Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        body::before {
            content: '';
            position: fixed;
            top: -50%; left: -50%;
            width: 200%; height: 200%;
            background: 
                radial-gradient(ellipse 200px 150px at 30% 40%, rgba(100, 180, 255, 0.12) 0%, transparent 100%),
                radial-gradient(ellipse 150px 200px at 70% 60%, rgba(80, 160, 240, 0.1) 0%, transparent 100%);
            animation: bgFlow 12s ease-in-out infinite;
            pointer-events: none;
        }
        @keyframes bgFlow {
            0%{transform:translate(0,0)} 50%{transform:translate(3%,2%)} 100%{transform:translate(0,0)}
        }

        .calendar-card {
            background: linear-gradient(135deg, rgba(100,180,255,0.1), rgba(50,120,200,0.05), rgba(100,180,255,0.08));
            backdrop-filter: blur(25px);
            border: 1.5px solid rgba(100,180,255,0.3);
            border-radius: 24px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
            width: 640px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            position: relative;
        }

        /* 头部 */
        .top-info { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
        .left-info { display: flex; flex-direction: column; gap: 2px; flex-shrink: 0; min-width: 180px; }
        .month-title { font-size: 16px; font-weight: 800; color: #00d4ff; white-space: nowrap; }
        .info-row { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #888; flex-wrap: wrap; }
        .info-row.lunar { color: #b08cff; }
        .weather-info { display: inline-flex; align-items: center; gap: 3px; font-size: 13px; color: #ffeb3b; }
        .weather-icon { font-size: 18px; }
        .weather-temp { color: #00d4ff; font-weight: 700; }
        .right-info { flex: 1; display: flex; justify-content: center; align-items: center; min-width: 160px; }

        /* 时钟 */
        .time {
            font-size: clamp(28px, 5vw, 42px);
            font-weight: 900;
            letter-spacing: 2px;
            color: #00d4ff;
            text-shadow: 0 0 20px rgba(0, 212, 255, 0.6);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .digit {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            width: 1.1em;
            height: 1.3em;
            margin: 0 1px;
            background: linear-gradient(135deg, rgba(100,180,255,0.15), rgba(50,120,200,0.08));
            backdrop-filter: blur(10px);
            border: 1px solid rgba(100,180,255,0.3);
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
            position: relative;
            overflow: hidden;
        }
        .digit::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; height: 50%;
            background: linear-gradient(180deg, rgba(255,255,255,0.08) 0%, transparent 100%);
            border-radius: 8px 8px 0 0;
            pointer-events: none;
        }

        .colon {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            width: 0.3em;
            margin: 0 1px;
            animation: colonBreath 2s ease-in-out infinite;
            color: #00d4ff;
            font-size: clamp(28px, 5vw, 42px);
            font-weight: 900;
        }
        @keyframes colonBreath { 0%{opacity:1} 50%{opacity:0.2} 100%{opacity:1} }

        /* 日历区域 - 带左右按钮 */
        .calendar-area {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .nav-arrow {
            background: rgba(100,180,255,0.15);
            border: 1.5px solid rgba(100,180,255,0.3);
            color: #00d4ff;
            border-radius: 50%;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 18px;
            font-weight: 700;
            transition: all 0.2s;
            flex-shrink: 0;
        }
        .nav-arrow:hover {
            background: rgba(0,200,255,0.3);
            border-color: #00d4ff;
            transform: scale(1.1);
        }

        .btn {
            background: rgba(100,180,255,0.15);
            border: 1px solid rgba(100,180,255,0.3);
            color: #00d4ff;
            border-radius: 8px;
            padding: 5px 12px;
            cursor: pointer;
            font-size: 12px;
        }
        .btn:hover { background: rgba(100,180,255,0.3); }

        /* 日历网格 */
        .cal-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 3px;
            background: rgba(100,180,255,0.06);
            border-radius: 12px;
            padding: 8px;
            flex: 1;
        }

        /* 表头 - 周一开始 */
        .cell.head {
            color: #b08cff;
            font-size: 14px;
            cursor: default;
            background: transparent;
            aspect-ratio: 1;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid transparent;
        }
        .cell.head:hover { background: transparent; }
        .cell.head.wk { color: #ff6b9d; }

        /* 日期单元格 - 正圆 */
        .cell {
            background: transparent;
            border-radius: 50%;
            aspect-ratio: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            position: relative;
            transition: all 0.15s ease;
            border: 2px solid transparent;
        }

        .cell .day-num {
            font-size: 20px;
            font-weight: 700;
            color: #e0f0ff;
            line-height: 1;
        }

        .cell .lunar-text {
            font-size: 11px;
            color: #999;
            line-height: 1;
        }

        .cell:hover { background: rgba(0, 120, 215, 0.15); }

        /* 选中 - 空心蓝圆 */
        .cell.selected {
            background: transparent !important;
            border: 2px solid #00d4ff !important;
        }
        .cell.selected .day-num { color: #00d4ff !important; }
        .cell.selected .lunar-text { color: #00bfff !important; }

        /* 当天 - 实心蓝圆 */
        .cell.today {
            background: #0078d4 !important;
            border: 2px solid #0078d4 !important;
        }
        .cell.today .day-num { color: white !important; font-weight: 800; }
        .cell.today .lunar-text { color: rgba(255,255,255,0.8) !important; }

        .cell.today.selected {
            background: #0078d4 !important;
            border: 2px solid #00a8e8 !important;
            box-shadow: 0 0 12px rgba(0, 120, 212, 0.5);
        }

        .cell.weekend .day-num { color: #ff6b9d; }
        .cell.today.weekend .day-num { color: white !important; }

        .cell.empty { background: transparent; cursor: default; }
        .cell.empty:hover { background: transparent; }
        .cell.empty .day-num { color: #444; }
        .cell.empty .lunar-text { color: #333; }

        .cell .dot {
            position: absolute;
            top: 2px;
            right: 2px;
            width: 5px; height: 5px;
            background: #ffc107;
            border-radius: 50%;
        }

        /* 假期样式 */
        .cell.holiday .day-num { color: #ff6b9d; font-weight: 800; }
        .cell.holiday .lunar-text { color: #ff9800; }
        .cell.holiday.today .day-num { color: white !important; }
        .cell.holiday.today .lunar-text { color: rgba(255,255,255,0.9) !important; }

        .watermark { position: absolute; bottom: 6px; right: 10px; font-size: 9px; color: rgba(100,100,100,0.5); }

        /* 弹窗 */
        .modal { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(5px); display: none; justify-content: center; align-items: center; z-index: 100; }
        .modal.open { display: flex; }
        .modal-box { background: linear-gradient(135deg, rgba(100,180,255,0.12), rgba(50,120,200,0.08)); backdrop-filter: blur(25px); border: 1.5px solid rgba(100,180,255,0.3); border-radius: 20px; padding: 25px; width: 320px; }
        .months-grid { display: grid; grid-template-columns: repeat(4,1fr); gap: 8px; margin-top: 15px; }
        .m-btn { height: 36px; display: flex; align-items: center; justify-content: center; border-radius: 8px; cursor: pointer; background: rgba(100,180,255,0.1); border: 1px solid rgba(100,180,255,0.2); color: #e0f0ff; font-size: 13px; }
        .m-btn:hover, .m-btn.active { background: rgba(0,200,255,0.3); border-color: #00d4ff; color: #00d4ff; }
        .year-input { width: 90px; text-align: center; background: transparent; border: 1px solid rgba(0,180,212,0.3); border-radius: 8px; padding: 6px 10px; color: #00d4ff; font-size: 18px; }

        @media (max-width: 640px) {
            .calendar-card { width: 95vw; padding: 12px; }
            .top-info { flex-direction: column; align-items: center; text-align: center; }
            .left-info { align-items: center; min-width: auto; }
            .right-info { min-width: auto; }
            .month-title { font-size: 14px; }
            .info-row { font-size: 10px; justify-content: center; }
            .cell .day-num { font-size: 14px; }
            .cell .lunar-text { font-size: 7px; }
            .nav-arrow { width: 28px; height: 28px; font-size: 14px; }
        }
    </style>
</head>
<body>

<div class="calendar-card">
    <div class="top-info">
        <div class="left-info">
            <div class="month-title" id="monthTitle">2026年6月21日</div>
            <div class="info-row" id="dayLine">第172天 第25周</div>
            <div class="info-row lunar" id="lunarLine">
                <span id="lunarText">五月廿七 周六</span>
                <span class="weather-info">
                    <span class="weather-icon" id="weatherIcon">☁️</span>
                    <span class="weather-temp" id="weatherTemp">28℃</span>
                </span>
            </div>
            <button class="btn" onclick="openModal()" style="margin-top:4px">📅 万年历</button>
        </div>
        <div class="right-info">
            <div class="time" id="clock"></div>
        </div>
    </div>

    <!-- 日历区域 - 带左右箭头 -->
    <div class="calendar-area">
        <div class="nav-arrow" onclick="changeMonth(-1)">◀</div>
        <div class="cal-grid" id="calGrid"></div>
        <div class="nav-arrow" onclick="changeMonth(1)">▶</div>
    </div>

    </div>

<div class="modal" id="modal" onclick="if(event.target===this)closeModal()">
    <div class="modal-box">
        <div style="display:flex;justify-content:center;align-items:center;gap:10px;margin-bottom:15px">
            <button class="btn" onclick="changeYear(-1)">◀</button>
            <input type="number" class="year-input" id="yearInput" value="2026">
            <button class="btn" onclick="changeYear(1)">▶</button>
        </div>
        <div style="text-align:center;font-size:18px;font-weight:700;color:#00d4ff;margin-bottom:15px" id="yearTitle">2026年</div>
        <div class="months-grid" id="monthsGrid"></div>
        <div style="text-align:center;margin-top:15px">
            <button class="btn" onclick="closeModal()">关闭</button>
        </div>
    </div>
</div>

<script>
    let curY = new Date().getFullYear();
    let curM = new Date().getMonth() + 1;
    let curD = new Date().getDate();
    let modalY = curY;
    let lastTime = '';
    let calendarCache = {};

    const WEATHER_ICONS = {'晴':'☀️','多云':'⛅','阴':'☁️','小雨':'🌦️','中雨':'🌧️','大雨':'🌧️','暴雨':'⛈️','雷阵雨':'⛈️','小雪':'🌨️','中雪':'❄️','大雪':'❄️','雨夹雪':'🌨️','雾':'🌫️','霾':'🌫️','阵雨':'🌦️','晴间多云':'🌤️','未知':'🌈'};

    function pad(n) { return n < 10 ? '0' + n : '' + n; }

    // 通过后端获取月历数据（含农历）
    async function fetchCalendar(year, month) {
        const key = year + '-' + month;
        if (calendarCache[key]) return calendarCache[key];
        
        try {
            console.log('Fetching calendar:', year, month);
            const res = await fetch('/api/calendar?year=' + year + '&month=' + month);
            console.log('Response status:', res.status);
            const data = await res.json();
            console.log('Response data:', data);
            
            if (data.success && data.days) {
                // 转换为前端需要的格式
                const days = data.days.map(d => ({
                    day: d.day,
                    month: d.month,
                    year: d.year,
                    currentMonth: d.currentMonth,
                    isWeekend: d.is_weekend,
                    lunar: d.lunar_day_name || '',
                    lunarMonth: d.lunar_month_name || '',
                    festivals: d.holiday_name ? [d.holiday_name] : (d.solar_term ? [d.solar_term] : []),
                    jieQi: d.solar_term || null,
                    isHoliday: d.is_holiday || false,
                    holidayName: d.holiday_name || null
                }));
                
                // 按周分组
                const weeks = [];
                for (let i = 0; i < days.length; i += 7) {
                    weeks.push(days.slice(i, i + 7));
                }
                
                const result = { year, month, weeks };
                calendarCache[key] = result;
                return result;
            } else {
                console.error('API error:', data.error || 'Unknown error');
                return null;
            }
        } catch (e) {
            console.error('获取日历数据失败:', e);
            return null;
        }
    }

    // 计算年度天数和周数
    function getDayOfYear(year, month, day) {
        const startOfYear = new Date(year, 0, 1);
        const current = new Date(year, month - 1, day);
        return Math.floor((current - startOfYear) / (1000 * 60 * 60 * 24)) + 1;
    }

    function getWeekOfYear(year, month, day) {
        return Math.ceil(getDayOfYear(year, month, day) / 7);
    }

    async function fetchWeather() {
        try {
            const res = await fetch('/api/weather');
            const data = await res.json();
            if (data.success && data.weather) {
                document.getElementById('weatherIcon').textContent = WEATHER_ICONS[data.weather] || '🌈';
                document.getElementById('weatherTemp').textContent = data.temperature + '℃';
            }
        } catch (e) {}
    }

    async function render() {
        const data = await fetchCalendar(curY, curM);
        if (!data) return;

        const weeks = data.weeks;
        const today = new Date();

        // 表头 - 周一开始
        let html = '';
        ['一','二','三','四','五','六','日'].forEach((h, i) => {
            html += '<div class="cell head ' + (i >= 5 ? 'wk' : '') + '">' + h + '</div>';
        });

        // 日期
        weeks.forEach(week => {
            week.forEach(day => {
                const isT = day.day === today.getDate() && day.month === today.getMonth()+1 && day.year === today.getFullYear();
                const isS = day.day === curD && day.currentMonth;
                const isW = day.isWeekend;
                const lunar = day.lunar || '';
                const lunarMonth = day.lunarMonth || '';
                const festivals = day.festivals || [];
                const jieQi = day.jieQi || '';
                const isHoliday = day.isHoliday || false;
                const holidayName = day.holidayName || null;

                let cls = 'cell';
                if (!day.currentMonth) cls += ' empty';
                if (isW && day.currentMonth) cls += ' weekend';
                if (isT) cls += ' today';
                if (isS && day.currentMonth) cls += ' selected';
                if (isHoliday && day.currentMonth) cls += ' holiday';

                // 优先显示：假期名 > 节日 > 节气 > 农历
                const displayLunar = holidayName || (jieQi || (festivals.length > 0 ? festivals[0] : lunar));

                html += '<div class="' + cls + '" onclick="selDay(' + day.day + ', ' + day.currentMonth + ')">';
                html += '<span class="day-num">' + day.day + '</span>';
                html += '<span class="lunar-text">' + displayLunar + '</span>';
                if (day.currentMonth && (isHoliday || festivals.length > 0)) html += '<div class="dot" title="' + (holidayName || festivals[0]) + '"></div>';
                html += '</div>';
            });
        });

        document.getElementById('calGrid').innerHTML = html;
        
        // 更新头部信息
        const d = new Date(curY, curM - 1, curD);
        const doy = getDayOfYear(curY, curM, curD);
        const woy = getWeekOfYear(curY, curM, curD);
        const wk = ['周日','周一','周二','周三','周四','周五','周六'];
        
        // 获取当天农历
        let lunarText = '';
        weeks.forEach(week => {
            week.forEach(day => {
                if (day.day === curD && day.currentMonth) {
                    lunarText = day.lunarMonth + day.lunar;
                }
            });
        });
        
        document.getElementById('monthTitle').textContent = curY + '年' + curM + '月' + curD + '日';
        document.getElementById('dayLine').textContent = '第' + doy + '天 第' + woy + '周';
        document.getElementById('lunarText').textContent = lunarText + ' ' + wk[d.getDay()];
    }

    function updateClock() {
        const now = new Date();
        const h = pad(now.getHours());
        const m = pad(now.getMinutes());
        const s = pad(now.getSeconds());
        const timeStr = h + m + s;
        if (timeStr !== lastTime) {
            lastTime = timeStr;
            document.getElementById('clock').innerHTML = 
                '<span class="digit">' + h[0] + '</span><span class="digit">' + h[1] + '</span>' +
                '<span class="colon">:</span>' +
                '<span class="digit">' + m[0] + '</span><span class="digit">' + m[1] + '</span>' +
                '<span class="colon">:</span>' +
                '<span class="digit">' + s[0] + '</span><span class="digit">' + s[1] + '</span>';
        }
    }

    function selDay(d, isCurrent) { 
        if (isCurrent) curD = d; 
        render(); 
    }
    
    function changeMonth(d) { 
        curM += d; 
        if(curM>12){curM=1;curY++} 
        if(curM<1){curM=12;curY--} 
        curD=1; 
        render(); 
    }
    
    function openModal() { 
        modalY=curY; 
        document.getElementById('yearInput').value=modalY; 
        document.getElementById('yearTitle').textContent=modalY+'年'; 
        renderMonths(); 
        document.getElementById('modal').classList.add('open'); 
    }
    
    function closeModal() { 
        document.getElementById('modal').classList.remove('open'); 
    }
    
    function changeYear(d) { 
        modalY+=d; 
        document.getElementById('yearInput').value=modalY; 
        document.getElementById('yearTitle').textContent=modalY+'年'; 
        renderMonths(); 
    }
    
    function renderMonths() {
        let h = '';
        ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'].forEach((m,i) => {
            h += '<div class="m-btn ' + ((i+1===curM && modalY===curY) ? 'active' : '') + '" onclick="jumpMonth(' + (i+1) + ')">' + m + '</div>';
        });
        document.getElementById('monthsGrid').innerHTML = h;
    }
    
    function jumpMonth(m) { 
        curY=modalY; 
        curM=m; 
        curD=1; 
        closeModal(); 
        render(); 
    }

    // 初始化
    render();
    updateClock();
    fetchWeather();
    setInterval(updateClock, 1000);
    setInterval(fetchWeather, 600000);
    setInterval(() => {
        const now = new Date();
        if(now.getDate() !== curD && curM === now.getMonth()+1 && curY === now.getFullYear()) {
            curD = now.getDate(); render();
        }
    }, 60000);
</script>

</body>
</html>
